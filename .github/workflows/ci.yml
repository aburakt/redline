name: ci
# main and PRs only: work-in-progress branch pushes don't run (or notify).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: dash (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y dash
      - run: bun run test
